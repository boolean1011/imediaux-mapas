# Gera e publica os mapas offline (grafos GraphHopper 11.1) das 27 UFs para o app iMediaUX Car.
# Grátis: só runners ubuntu-latest padrão de repositório público.
#  preparar  -> baixa brazil-latest.osm.pbf (Geofabrik), confere md5, recorta as 27 UFs (osmium) e calcula as divisas
#  grafo     -> matriz de 27 jobs paralelos: importa (perfil car + conversões + CH), verifica uma rota, empacota .ghz + .sha256
#               e anexa à release em RASCUNHO
#  publicar  -> só roda se TODAS as UFs deram certo: monta manifest.json (27 UFs + divisas) e só então publica a release como latest.
#               Se qualquer UF falhar, a release fica em rascunho e o latest anterior continua valendo.
name: Mapas mensais (27 UFs)

on:
  schedule:
    - cron: "0 6 5 * *"   # dia 5 de cada mês, 06:00 UTC (03:00 em Brasília)
  workflow_dispatch:
    inputs:
      ufs:
        description: "UFs separadas por vírgula (vazio = todas as 27). Rodada parcial NUNCA é publicada como latest."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: mapas
  cancel-in-progress: false

env:
  PBF_URL: https://download.geofabrik.de/south-america/brazil-latest.osm.pbf
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      versao: ${{ steps.v.outputs.versao }}
      tag: ${{ steps.v.outputs.tag }}
      ufs: ${{ steps.v.outputs.ufs }}
      completo: ${{ steps.v.outputs.completo }}
    steps:
      - uses: actions/checkout@v4

      - name: Versão, tag e UFs
        id: v
        env:
          UFS_IN: ${{ inputs.ufs }}
        run: |
          set -euo pipefail
          V=$(TZ=America/Sao_Paulo date +%Y.%m)
          TODAS=$(grep -v '^#' tools/uf_limites.txt | cut -d';' -f1 | sed '/^$/d' | sort | paste -sd, -)
          SEL=$(echo "${UFS_IN:-}" | tr 'a-z ' 'A-Z,' | tr -s ',' | sed 's/^,//;s/,$//')
          if [ -z "$SEL" ]; then SEL=$TODAS; COMPLETO=true; else COMPLETO=false; fi
          for u in ${SEL//,/ }; do grep -qx "$u" <<<"${TODAS//,/$'\n'}" || { echo "::error::UF inválida: $u"; exit 1; }; done
          # tag: AAAA.MM; se já existir release publicada com esse nome, usa AAAA.MM-r<run_number>.
          # Rascunho criado por ESTA mesma execução (re-run) é reaproveitado.
          T=$V
          for cand in "$V" "$V-r$GITHUB_RUN_NUMBER"; do
            T=$cand
            if info=$(gh release view "$cand" --json isDraft,body 2>/dev/null); then
              if [ "$(jq -r .isDraft <<<"$info")" = true ] && jq -r .body <<<"$info" | grep -q "run-id: $GITHUB_RUN_ID"; then break; fi
              T=""; continue
            fi
            break
          done
          [ -n "$T" ] || { echo "::error::não achei tag livre para $V"; exit 1; }
          echo "versao=$V" >> "$GITHUB_OUTPUT"
          echo "tag=$T" >> "$GITHUB_OUTPUT"
          echo "completo=$COMPLETO" >> "$GITHUB_OUTPUT"
          echo "ufs=$(jq -Rc 'split(",")' <<<"$SEL")" >> "$GITHUB_OUTPUT"
          echo "versão $V, tag $T, UFs $SEL (completo=$COMPLETO)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Rascunho da release
        env:
          T: ${{ steps.v.outputs.tag }}
          V: ${{ steps.v.outputs.versao }}
        run: |
          set -euo pipefail
          if ! gh release view "$T" >/dev/null 2>&1; then
            printf 'Rascunho em construção pelo workflow (o latest anterior continua valendo até esta release ficar completa).\n\n<!-- run-id: %s -->\n' "$GITHUB_RUN_ID" > notas.md
            gh release create "$T" --draft --title "Mapas $V" --notes-file notas.md --target "$GITHUB_SHA"
          fi

      - name: Ferramentas (osmium, shapely, pyosmium)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
          pip install --quiet "shapely>=2" osmium numpy
          osmium --version | head -1; df -h . | tail -1; free -g | head -2

      - name: Baixar brazil-latest.osm.pbf (Geofabrik) e conferir md5
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 30 -o brazil.osm.pbf "$PBF_URL"
          curl -fsSL --retry 5 -o brazil.osm.pbf.md5 "$PBF_URL.md5"
          echo "$(cut -d' ' -f1 brazil.osm.pbf.md5)  brazil.osm.pbf" | md5sum -c -
          ls -l brazil.osm.pbf; osmium fileinfo brazil.osm.pbf | grep -i timestamp || true

      - name: Polígonos das UFs
        run: python3 tools/build_mapas.py --pbf brazil.osm.pbf --trabalho "$PWD/trabalho" --etapa poly

      - name: Recorte por UF (osmium extract, 3 lotes de 9)
        env:
          UFS: ${{ steps.v.outputs.ufs }}
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import json, os
          cfg = json.load(open("trabalho/recortes.json"))
          sel = set(json.loads(os.environ["UFS"]))
          ex = [e for e in cfg["extracts"] if e["output"].split(".")[0] in sel]
          for i in range(0, len(ex), 9):
              json.dump({**cfg, "extracts": ex[i:i + 9]}, open(f"trabalho/lote_{i // 9}.json", "w"))
          EOF
          mkdir -p trabalho/pbf
          for f in trabalho/lote_*.json; do osmium extract --overwrite -s smart -c "$f" brazil.osm.pbf; done
          ls -l trabalho/pbf; df -h . | tail -1

      - name: Divisas (gateways entre UFs)
        run: |
          set -euo pipefail
          osmium tags-filter --overwrite -o rodovias.osm.pbf brazil.osm.pbf \
            w/highway=motorway,trunk,primary,secondary,motorway_link,trunk_link
          python3 tools/build_mapas.py --pbf rodovias.osm.pbf --trabalho "$PWD/trabalho" --etapa divisas
          n=$(jq 'length' trabalho/gateways.json); echo "pares de divisa: $n"
          [ "$n" -ge 40 ] || { echo "::error::poucas divisas ($n), algo errado"; exit 1; }

      - uses: actions/upload-artifact@v4
        with: { name: gateways, path: trabalho/gateways.json, retention-days: 3 }
      - uses: actions/upload-artifact@v4
        with: { name: pbf-AC, path: trabalho/pbf/AC.osm.pbf, if-no-files-found: ignore, compression-level: 0, retention-days: 3 }
      - uses: actions/upload-artifact@v4
        with: { name: pbf-AL, path: trabalho/pbf/AL.osm.pbf, if-no-files-found: ignore, compression-level: 0, retention-days: 3 }
      - uses: actions/upload-artifact@v4
        with: { name: pbf-AM, path: trabalho/pbf/AM.osm.pbf, if-no-files-found: ignore, compression-level: 0, retention-days: 3 }
      - uses: actions/upload-artifact@v4
        with: { name: pbf-AP, path: trabalho/pbf/AP.osm.pbf, if-no-files-found: ignore, compression-level: 0, retention-days: 3 }
      - uses: actions/upload-artifact@v4
        with: { name: pbf-BA, path: trabalho/pbf/BA.osm.pbf, if-no-files-found: ignore, compression-level: 0, retention-days: 3 }
      - uses: actions/upload-artifact@v4
        with: { name: pbf-CE, path: trabalho/pbf/CE.osm.pbf, if-no-files-found: ignore, compression-level: 0, retention-days: 3 }
      - uses: actions/upload-artifact@v4
        with: { name: pbf-DF, path: trabalho/pbf/DF.osm.pbf, if-no-files-found: ignore, compression-level: 0, retention-days: 3 }
      - uses: actions/upload-artifact@v4
        with: { name: pbf-ES, path: trabalho/pbf/ES.osm.pbf, if-no-files-found: ignore, compression-level: 0, retention-days: 3 }
      - uses: actions/upload-artifact@v4
        with: { name: pbf-GO, path: trabalho/pbf/GO.osm.pbf, if-no-files-found: ignore, compression-level: 0, retention-days: 3 }
      - uses: actions/upload-artifact@v4
        with: { name: pbf-MA, path: trabalho/pbf/MA.osm.pbf, if-no-files-found: ignore, compression-level: 0, retention-days: 3 }
      - uses: actions/upload-artifact@v4
        with: { name: pbf-MG, path: trabalho/pbf/MG.osm.pbf, if-no-files-found: ignore, compression-level: 0, retention-days: 3 }
      - uses: actions/upload-artifact@v4
        with: { name: pbf-MS, path: trabalho/pbf/MS.osm.pbf, if-no-files-found: ignore, compression-level: 0, retention-days: 3 }
      - uses: actions/upload-artifact@v4
        with: { name: pbf-MT, path: trabalho/pbf/MT.osm.pbf, if-no-files-found: ignore, compression-level: 0, retention-days: 3 }
      - uses: actions/upload-artifact@v4
        with: { name: pbf-PA, path: trabalho/pbf/PA.osm.pbf, if-no-files-found: ignore, compression-level: 0, retention-days: 3 }
      - uses: actions/upload-artifact@v4
        with: { name: pbf-PB, path: trabalho/pbf/PB.osm.pbf, if-no-files-found: ignore, compression-level: 0, retention-days: 3 }
      - uses: actions/upload-artifact@v4
        with: { name: pbf-PE, path: trabalho/pbf/PE.osm.pbf, if-no-files-found: ignore, compression-level: 0, retention-days: 3 }
      - uses: actions/upload-artifact@v4
        with: { name: pbf-PI, path: trabalho/pbf/PI.osm.pbf, if-no-files-found: ignore, compression-level: 0, retention-days: 3 }
      - uses: actions/upload-artifact@v4
        with: { name: pbf-PR, path: trabalho/pbf/PR.osm.pbf, if-no-files-found: ignore, compression-level: 0, retention-days: 3 }
      - uses: actions/upload-artifact@v4
        with: { name: pbf-RJ, path: trabalho/pbf/RJ.osm.pbf, if-no-files-found: ignore, compression-level: 0, retention-days: 3 }
      - uses: actions/upload-artifact@v4
        with: { name: pbf-RN, path: trabalho/pbf/RN.osm.pbf, if-no-files-found: ignore, compression-level: 0, retention-days: 3 }
      - uses: actions/upload-artifact@v4
        with: { name: pbf-RO, path: trabalho/pbf/RO.osm.pbf, if-no-files-found: ignore, compression-level: 0, retention-days: 3 }
      - uses: actions/upload-artifact@v4
        with: { name: pbf-RR, path: trabalho/pbf/RR.osm.pbf, if-no-files-found: ignore, compression-level: 0, retention-days: 3 }
      - uses: actions/upload-artifact@v4
        with: { name: pbf-RS, path: trabalho/pbf/RS.osm.pbf, if-no-files-found: ignore, compression-level: 0, retention-days: 3 }
      - uses: actions/upload-artifact@v4
        with: { name: pbf-SC, path: trabalho/pbf/SC.osm.pbf, if-no-files-found: ignore, compression-level: 0, retention-days: 3 }
      - uses: actions/upload-artifact@v4
        with: { name: pbf-SE, path: trabalho/pbf/SE.osm.pbf, if-no-files-found: ignore, compression-level: 0, retention-days: 3 }
      - uses: actions/upload-artifact@v4
        with: { name: pbf-SP, path: trabalho/pbf/SP.osm.pbf, if-no-files-found: ignore, compression-level: 0, retention-days: 3 }
      - uses: actions/upload-artifact@v4
        with: { name: pbf-TO, path: trabalho/pbf/TO.osm.pbf, if-no-files-found: ignore, compression-level: 0, retention-days: 3 }

  grafo:
    needs: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        uf: ${{ fromJSON(needs.preparar.outputs.ufs) }}
    env:
      UF: ${{ matrix.uf }}
      V: ${{ needs.preparar.outputs.versao }}
      T: ${{ needs.preparar.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: gradle }
      - uses: actions/download-artifact@v4
        with: { name: "pbf-${{ matrix.uf }}", path: trabalho/pbf }
      - name: Compilar importador (GraphHopper 11.1)
        run: ./gradlew -p importer -q --no-daemon installDist
      - name: Importar ${{ matrix.uf }} (car + conversões + CH)
        run: |
          set -euo pipefail
          ls -l trabalho/pbf
          G=$(awk '/MemTotal/{x=int($2/1048576*0.7); if(x>10)x=10; print x}' /proc/meminfo)
          echo "heap: ${G}g"; free -g | head -2; df -h . | tail -1
          JAVA_OPTS="-Xmx${G}g -XX:+UseParallelGC" importer/build/install/mapas-importer/bin/mapas-importer \
            "trabalho/pbf/$UF.osm.pbf" "trabalho/grafos/$UF" 2>&1 | grep -vE 'INFO .*(PrepareContractionHierarchies|EdgeBasedNodeContractor)' | tail -n 60
          test -f "trabalho/grafos/$UF/properties"
      - name: Verificar rota na capital (abre como o app, MMAP_RO)
        run: |
          set -euo pipefail
          read A B < <(jq -r --arg u "$UF" '.[$u] | "\(.[0]),\(.[1]) \(.[0]-0.02),\(.[1]-0.02)"' tools/capitais.json)
          importer/build/install/mapas-importer/bin/mapas-importer verificar "trabalho/grafos/$UF" "$A" "$B" 2>&1 | grep -v ' INFO '
      - name: Empacotar .ghz + .sha256
        run: |
          set -euo pipefail
          python3 tools/build_mapas.py --pbf x --trabalho trabalho --saida saida --versao "$V" --ufs "$UF" --etapa pacotes
          cd saida && sha256sum "$UF-$V.ghz" > "$UF-$V.ghz.sha256" && cat "$UF-$V.ghz.sha256"
          s=$(stat -c %s "$UF-$V.ghz"); [ "$s" -lt 2000000000 ] || { echo "::error::$UF passa de 2 GB ($s)"; exit 1; }
      - name: Anexar ao rascunho da release
        run: gh release upload "$T" "saida/$UF-$V.ghz" "saida/$UF-$V.ghz.sha256" --clobber
      - uses: actions/upload-artifact@v4
        with: { name: "meta-${{ matrix.uf }}", path: saida/manifest.json, retention-days: 7 }

  publicar:
    needs: [preparar, grafo]
    if: ${{ success() && needs.preparar.outputs.completo == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      V: ${{ needs.preparar.outputs.versao }}
      T: ${{ needs.preparar.outputs.tag }}
      UFS: ${{ needs.preparar.outputs.ufs }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: "meta-*", path: partes }
      - uses: actions/download-artifact@v4
        with: { name: gateways, path: gw }
      - name: manifest.json (27 UFs + divisas)
        run: |
          set -euo pipefail
          python3 tools/montar_manifest.py --partes partes --gateways gw/gateways.json --versao "$V" \
            --esperadas "$(jq -r 'join(",")' <<<"$UFS")" --saida manifest.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Conferir anexos da release (todas as UFs, tamanhos batendo)
        run: |
          set -euo pipefail
          gh release view "$T" --json assets > assets.json
          python3 - <<'EOF'
          import json, sys
          m = json.load(open("manifest.json")); a = {x["name"]: x["size"] for x in json.load(open("assets.json"))["assets"]}
          ruins = [u for u, e in m["states"].items() if a.get(e["url"]) != e["size"] or e["url"] + ".sha256" not in a]
          if len(m["states"]) != 27 or ruins:
              sys.exit(f"release incompleta: {len(m['states'])} UFs no manifest, com problema: {ruins}")
          print("27 UFs anexadas e conferidas")
          EOF
      - name: LEIA-ME e notas
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import json, os
          m = json.load(open("manifest.json")); v = m["version"]
          tb = sum(e["size"] for e in m["states"].values()); ti = sum(e["installed"] for e in m["states"].values())
          linhas = "\n".join(f"| {u} | {e['size']/1e6:.0f} MB | {e['installed']/1e6:.0f} MB | `{e['sha256'][:16]}…` |" for u, e in m["states"].items())
          atrib = ("Dados de mapa © colaboradores do OpenStreetMap, disponíveis sob a Open Database License (ODbL) 1.0 — "
                   "https://www.openstreetmap.org/copyright · https://opendatacommons.org/licenses/odbl/1-0/\n"
                   "Grafos gerados com GraphHopper 11.1 (Apache License 2.0) — https://github.com/graphhopper/graphhopper\n"
                   "Extrato do OSM: Geofabrik (brazil-latest.osm.pbf). Limites das UFs: IBGE (dados abertos).\n")
          open("notas.md", "w").write(
              f"Mapas offline (grafos GraphHopper 11.1, perfil car com restrições de conversão + CH) das 27 UFs para o iMediaUX Car.\n\n"
              f"Versão **{v}** · {len(m['states'])} UFs · {len(m['gateways'])} pares de divisa · "
              f"download total {tb/1e9:.2f} GB · instalado {ti/1e9:.2f} GB.\n\n"
              f"| UF | download | instalado | sha256 |\n|---|---|---|---|\n{linhas}\n\n"
              f"### Atribuição e licenças\n{atrib}\nSem dados pessoais.\n\n<!-- run-id: {os.environ['GITHUB_RUN_ID']} -->\n")
          open("LEIA-ME.txt", "w").write(
              f"Mapas offline do iMediaUX Car — versão {v}\n"
              f"manifest.json  formato 1, url relativa (resolve contra .../releases/latest/download)\n"
              f"<UF>-{v}.ghz   grafo GraphHopper 11.1 (zip), <UF>-{v}.ghz.sha256\n\n" + atrib + "Sem dados pessoais.\n")
          EOF
          cat notas.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar como latest (só agora, com tudo anexado)
        run: |
          set -euo pipefail
          gh release upload "$T" manifest.json LEIA-ME.txt --clobber
          gh release edit "$T" --notes-file notas.md --draft=false --latest
      - name: Conferir latest/download
        run: |
          set -euo pipefail
          B="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download"
          for i in 1 2 3 4 5 6; do
            curl -fsSL "$B/manifest.json" -o m.json && [ "$(jq -r .version m.json)" = "$V" ] && [ "$(jq '.states|length' m.json)" = 27 ] && break
            sleep 20
          done
          jq -e '.states|length == 27' m.json
          curl -fsSIL -o /dev/null -w "GO: %{http_code}\n" "$B/GO-$V.ghz"
